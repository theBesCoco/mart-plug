
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Plug</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>SMART PLUG</h1>
    <p>ระบบควบคุมปลั๊กไฟอัจฉริยะ</p>

    <div class="plug">
      <svg viewBox="0 0 160 180" width="150">
        <rect x="35" y="35" width="90" height="110" rx="25"
          fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
        <rect x="58" y="15" width="12" height="35" rx="6"
          fill="#38bdf8"/>
        <rect x="90" y="15" width="12" height="35" rx="6"
          fill="#38bdf8"/>
        <circle cx="80" cy="90" r="17" fill="#38bdf8"/>
        <path d="M80 75 V90 L91 99" stroke="#0f172a"
          stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M80 145 V165" stroke="#38bdf8"
          stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="status" id="status">OFF</div>

    <button id="powerButton" onclick="togglePower()">เปิดใช้งาน</button>

    <p class="footer">ESP32 SMART PLUG CONTROL</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
